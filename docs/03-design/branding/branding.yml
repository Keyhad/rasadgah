# Canonical branding definition for Rasadgah.
# Documents in this folder describe these values; when they differ, this file is authoritative.
# The application implements the colour tokens in src/app/globals.css.

identity:
  name: "Rasadgah"
  meaning: "Persian رصدگاه, 'observatory'"
  tagline: "KPI observatory"
  slogan: "Observe what matters."
  description: "Upload KPIs with a private write token and share a clean, read-only dashboard over HTTPS. No account required."
  tags:
    - KPI
    - Dashboard
    - Monitoring
    - Self-hosted

logo:
  concept: "Observatory dome with rising KPI bars and a telescope aimed at a target star"
  assets:
    full: "logo/logo.svg"
    dark: "logo/logo-dark.svg"
    light: "logo/logo-light.svg"
    icon: "logo/logo-icon.svg"
  app_copy: "public/brand/logo-icon.svg"

typography:
  fonts:
    sans: "'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
    display: "'Outfit', 'Inter', system-ui, sans-serif"
    mono: "'JetBrains Mono', ui-monospace, Consolas, monospace"
  sources:
    - "fonts/inter"
    - "fonts/outfit"
    - "fonts/jetbrains-mono"

geometry:
  radius:
    control: "8px"
    panel: "12px"
    icon_tile: "22%"
  spacing:
    page_padding: "1.5rem"
    section_gap: "1.5rem"
    grid_gap: "1rem"
  layout:
    max_width: "1100px"
    kpi_card_min_width: "220px"

colors:
  brand:
    sky_400: "#38BDF8"
    sky_700: "#0369A1"
    star_400: "#FBBF24"
    navy_900: "#0F172A"
  dark:
    bg: "#0F172A"
    panel: "#1E293B"
    border: "#334155"
    text: "#E2E8F0"
    muted: "#94A3B8"
    accent: "#38BDF8"
    on_accent: "#0F172A"
  light:
    bg: "#F8FAFC"
    panel: "#FFFFFF"
    border: "#E2E8F0"
    text: "#0F172A"
    muted: "#475569"
    accent: "#0369A1"
    on_accent: "#FFFFFF"
  semantic:
    positive: "#4ADE80"
    negative: "#F87171"
    neutral: "#94A3B8"
    target: "#FBBF24"

themes:
  default: "night-sky"
  available:
    - "night-sky"
