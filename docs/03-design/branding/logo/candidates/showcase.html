<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Rasadgah — logo candidates</title>
  <style>
    body { margin: 0; font-family: system-ui, sans-serif; background: #0F172A; color: #E2E8F0; }
    main { max-width: 960px; margin: 0 auto; padding: 2rem; }
    h1, h2 { font-weight: 600; }
    .row { display: flex; flex-wrap: wrap; gap: 1.5rem; }
    figure { margin: 0; padding: 1rem; border: 1px solid #334155; border-radius: 12px; background: #1E293B; text-align: center; }
    figure.light { background: #F8FAFC; color: #0F172A; border-color: #E2E8F0; }
    figcaption { margin-top: .75rem; font-size: .9rem; }
    .sizes img { margin: 0 .5rem; vertical-align: middle; }
  </style>
</head>
<body>
<main>
  <h1>Rasadgah logo candidates</h1>

  <h2>Candidates (128 px and favicon sizes)</h2>
  <div class="row">
    <figure>
      <img src="concept-a-dome-bars.svg" width="128" height="128" alt="">
      <div class="sizes"><img src="concept-a-dome-bars.svg" width="32" height="32" alt=""><img src="concept-a-dome-bars.svg" width="16" height="16" alt=""></div>
      <figcaption>A — Dome and rising bars (selected)</figcaption>
    </figure>
    <figure>
      <img src="concept-b-lens-trend.svg" width="128" height="128" alt="">
      <div class="sizes"><img src="concept-b-lens-trend.svg" width="32" height="32" alt=""><img src="concept-b-lens-trend.svg" width="16" height="16" alt=""></div>
      <figcaption>B — Lens and trend</figcaption>
    </figure>
    <figure>
      <img src="concept-c-gauge-horizon.svg" width="128" height="128" alt="">
      <div class="sizes"><img src="concept-c-gauge-horizon.svg" width="32" height="32" alt=""><img src="concept-c-gauge-horizon.svg" width="16" height="16" alt=""></div>
      <figcaption>C — Gauge horizon</figcaption>
    </figure>
  </div>

  <h2>Selected lockups</h2>
  <div class="row">
    <figure><img src="../logo.svg" width="360" height="96" alt=""><figcaption>logo.svg</figcaption></figure>
    <figure><img src="../logo-dark.svg" width="360" height="96" alt=""><figcaption>logo-dark.svg</figcaption></figure>
    <figure class="light"><img src="../logo-light.svg" width="360" height="96" alt=""><figcaption>logo-light.svg</figcaption></figure>
  </div>
</main>
</body>
</html>
