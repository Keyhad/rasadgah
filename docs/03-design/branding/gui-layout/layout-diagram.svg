<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 900" width="1000" height="900" font-family="'Inter', system-ui, sans-serif" role="img" aria-labelledby="title">
  <title id="title">Rasadgah GUI layout: start screen, editor and shared view</title>
  <rect width="1000" height="900" fill="#F8FAFC"/>

  <!-- Start screen -->
  <text x="24" y="30" font-size="13" font-weight="700" fill="#0F172A">Start screen — /</text>
  <g transform="translate(24 44)">
    <rect width="360" height="480" rx="10" fill="#0F172A"/>
    <line x1="0" y1="44" x2="360" y2="44" stroke="#334155"/>
    <rect x="14" y="12" width="20" height="20" rx="5" fill="#38BDF8"/>
    <text x="42" y="27" font-size="13" font-weight="700" fill="#E2E8F0">Rasadgah</text>
    <text x="112" y="27" font-size="11" fill="#94A3B8">KPI observatory</text>

    <rect x="16" y="60" width="328" height="270" rx="8" fill="#1E293B" stroke="#334155"/>
    <text x="30" y="84" font-size="12" font-weight="600" fill="#E2E8F0">Your tokens</text>
    <text x="30" y="102" font-size="10" fill="#94A3B8">Save both tokens now. They cannot be recovered.</text>

    <text x="30" y="124" font-size="9" fill="#94A3B8">Write token</text>
    <rect x="30" y="130" width="230" height="28" rx="6" fill="#0F172A" stroke="#334155"/>
    <text x="40" y="148" font-size="10" font-family="ui-monospace, monospace" fill="#E2E8F0">wA8-rjE-pGXEvhg5nCiAtG6uKwt9SqIm</text>
    <rect x="270" y="130" width="60" height="28" rx="6" fill="#38BDF8"/>
    <text x="284" y="148" font-size="11" font-weight="600" fill="#0F172A">Copy</text>
    <text x="30" y="172" font-size="9" fill="#94A3B8">Keep it secret. It uploads KPIs and opens the editor.</text>

    <text x="30" y="196" font-size="9" fill="#94A3B8">Read token</text>
    <rect x="30" y="202" width="230" height="28" rx="6" fill="#0F172A" stroke="#334155"/>
    <text x="40" y="220" font-size="10" font-family="ui-monospace, monospace" fill="#E2E8F0">CwHdw8pvuu8vUj9sM5-tFjqJnY_Gtv0q</text>
    <rect x="270" y="202" width="60" height="28" rx="6" fill="#38BDF8"/>
    <text x="284" y="220" font-size="11" font-weight="600" fill="#0F172A">Copy</text>
    <text x="30" y="244" font-size="9" fill="#94A3B8">Share it. It shows your KPIs read-only.</text>

    <text x="30" y="270" font-size="10" fill="#94A3B8">Both expire Oct 14, 2026, 4:06 PM UTC.</text>
    <text x="30" y="296" font-size="11" fill="#38BDF8" text-decoration="underline">Open editor</text>
    <text x="120" y="296" font-size="11" fill="#38BDF8" text-decoration="underline">Open shared view</text>
    <text x="30" y="318" font-size="9" fill="#64748B">TokenPanel + CopyField</text>

    <rect x="16" y="346" width="328" height="118" rx="8" fill="#1E293B" stroke="#334155"/>
    <text x="30" y="370" font-size="12" font-weight="600" fill="#E2E8F0">Upload KPIs</text>
    <text x="30" y="390" font-size="10" fill="#94A3B8">JSON file (download an example)</text>
    <rect x="30" y="404" width="200" height="30" rx="6" fill="#0F172A" stroke="#334155"/>
    <text x="40" y="423" font-size="10" fill="#94A3B8">Choose file…</text>
    <rect x="240" y="404" width="70" height="30" rx="6" fill="#38BDF8"/>
    <text x="252" y="423" font-size="11" font-weight="600" fill="#0F172A">Upload</text>
    <text x="30" y="454" font-size="9" fill="#64748B">UploadForm (write token)</text>
  </g>

  <!-- Editor -->
  <text x="408" y="30" font-size="13" font-weight="700" fill="#0F172A">Editor — /?token=&lt;write token&gt;</text>
  <g transform="translate(408 44)">
    <rect width="568" height="480" rx="10" fill="#0F172A"/>
    <line x1="0" y1="44" x2="568" y2="44" stroke="#334155"/>
    <rect x="14" y="12" width="20" height="20" rx="5" fill="#38BDF8"/>
    <text x="42" y="27" font-size="13" font-weight="700" fill="#E2E8F0">Rasadgah</text>
    <text x="112" y="27" font-size="11" fill="#94A3B8">KPI observatory</text>

    <rect x="16" y="60" width="536" height="126" rx="8" fill="#1E293B" stroke="#334155"/>
    <text x="30" y="84" font-size="12" font-weight="600" fill="#E2E8F0">Editor</text>
    <text x="30" y="106" font-size="9" fill="#94A3B8">Last upload</text>
    <text x="30" y="122" font-size="10" font-weight="600" fill="#E2E8F0">Oct 7, 2026, 4:06 PM UTC (just now)</text>
    <text x="250" y="106" font-size="9" fill="#94A3B8">Tokens expire</text>
    <text x="250" y="122" font-size="10" font-weight="600" fill="#E2E8F0">Oct 14, 2026, 4:06 PM UTC</text>
    <text x="440" y="106" font-size="9" fill="#94A3B8">On target</text>
    <text x="440" y="122" font-size="10" font-weight="600" fill="#E2E8F0">2 / 4</text>
    <text x="30" y="144" font-size="9" fill="#94A3B8">Share link (read-only)</text>
    <rect x="30" y="150" width="300" height="26" rx="6" fill="#0F172A" stroke="#334155"/>
    <text x="40" y="167" font-size="10" font-family="ui-monospace, monospace" fill="#E2E8F0">/?token=CwHdw8pvuu8vUj9sM5-tFjqJnY_Gtv0q</text>
    <rect x="340" y="150" width="56" height="26" rx="6" fill="#38BDF8"/>
    <text x="352" y="167" font-size="11" font-weight="600" fill="#0F172A">Copy</text>
    <text x="408" y="167" font-size="11" fill="#38BDF8" text-decoration="underline">Open</text>

    <g font-size="9">
      <g transform="translate(16 200)">
        <rect width="125" height="104" rx="8" fill="#1E293B" stroke="#334155"/>
        <rect width="4" height="104" rx="2" fill="#4ADE80"/>
        <text x="14" y="22" fill="#94A3B8">Monthly revenue</text>
        <text x="14" y="50" font-size="18" font-weight="700" fill="#E2E8F0">$128,400</text>
        <text x="14" y="72" fill="#4ADE80">▲ +9.5%</text>
        <text x="14" y="92" fill="#E2E8F0">On target</text>
      </g>
      <g transform="translate(153 200)">
        <rect width="125" height="104" rx="8" fill="#1E293B" stroke="#334155"/>
        <rect width="4" height="104" rx="2" fill="#F87171"/>
        <text x="14" y="22" fill="#94A3B8">Active users</text>
        <text x="14" y="50" font-size="18" font-weight="700" fill="#E2E8F0">8,421</text>
        <text x="14" y="72" fill="#F87171">▼ -5.4%</text>
        <text x="14" y="92" fill="#F87171">Off target</text>
      </g>
      <g transform="translate(290 200)">
        <rect width="125" height="104" rx="8" fill="#1E293B" stroke="#334155"/>
        <rect width="4" height="104" rx="2" fill="#4ADE80"/>
        <text x="14" y="22" fill="#94A3B8">Conversion rate</text>
        <text x="14" y="50" font-size="18" font-weight="700" fill="#E2E8F0">3.8%</text>
        <text x="14" y="72" fill="#4ADE80">▲ +8.6%</text>
      </g>
      <g transform="translate(427 200)">
        <rect width="125" height="104" rx="8" fill="#1E293B" stroke="#334155"/>
        <rect width="4" height="104" rx="2" fill="#4ADE80"/>
        <text x="14" y="22" fill="#94A3B8">API latency (p95)</text>
        <text x="14" y="50" font-size="18" font-weight="700" fill="#E2E8F0">245 ms</text>
        <text x="14" y="72" fill="#4ADE80">▼ -21%</text>
        <text x="14" y="92" fill="#E2E8F0">On target</text>
      </g>
    </g>
    <text x="16" y="322" font-size="9" fill="#64748B">KPI grid — repeat(auto-fill, minmax(220px, 1fr)); 4 columns at max width</text>

    <rect x="16" y="336" width="536" height="104" rx="8" fill="#1E293B" stroke="#334155"/>
    <text x="30" y="360" font-size="12" font-weight="600" fill="#E2E8F0">Update KPIs</text>
    <text x="30" y="380" font-size="10" fill="#94A3B8">Every upload extends the lifetime of both tokens by one week.</text>
    <rect x="30" y="394" width="200" height="30" rx="6" fill="#0F172A" stroke="#334155"/>
    <text x="40" y="413" font-size="10" fill="#94A3B8">Choose file…</text>
    <rect x="240" y="394" width="70" height="30" rx="6" fill="#38BDF8"/>
    <text x="252" y="413" font-size="11" font-weight="600" fill="#0F172A">Upload</text>
    <text x="16" y="462" font-size="9" fill="#64748B">Invalid or expired token: a single notice panel "Token expired or unknown" replaces all panels.</text>
  </g>

  <!-- Shared view -->
  <text x="24" y="560" font-size="13" font-weight="700" fill="#0F172A">Shared view — /?token=&lt;read token&gt; (no controls, no token information)</text>
  <g transform="translate(24 574)">
    <rect width="952" height="300" rx="10" fill="#0F172A"/>
    <line x1="0" y1="44" x2="952" y2="44" stroke="#334155"/>
    <rect x="14" y="12" width="20" height="20" rx="5" fill="#38BDF8"/>
    <text x="42" y="27" font-size="13" font-weight="700" fill="#E2E8F0">Rasadgah</text>
    <text x="112" y="27" font-size="11" fill="#94A3B8">KPI observatory</text>

    <text x="16" y="76" font-size="11" fill="#94A3B8">Updated <tspan font-weight="700" fill="#E2E8F0">3 hours ago</tspan>
      <tspan font-size="10">(Oct 7, 2026, 4:06 PM UTC) · data as of Oct 7, 2026, 8:00 AM UTC</tspan>
    </text>

    <g font-size="10">
      <g transform="translate(16 96)">
        <rect width="222" height="120" rx="8" fill="#1E293B" stroke="#334155"/>
        <rect width="4" height="120" rx="2" fill="#4ADE80"/>
        <text x="16" y="26" fill="#94A3B8">Monthly revenue</text>
        <text x="16" y="60" font-size="24" font-weight="700" fill="#E2E8F0">$128,400</text>
        <text x="16" y="84" fill="#4ADE80">▲ +9.5%</text>
        <text x="16" y="104" fill="#E2E8F0">On target · target $125,000</text>
      </g>
      <g transform="translate(250 96)">
        <rect width="222" height="120" rx="8" fill="#1E293B" stroke="#334155"/>
        <rect width="4" height="120" rx="2" fill="#F87171"/>
        <text x="16" y="26" fill="#94A3B8">Active users</text>
        <text x="16" y="60" font-size="24" font-weight="700" fill="#E2E8F0">8,421</text>
        <text x="16" y="84" fill="#F87171">▼ -5.4%</text>
        <text x="16" y="104" fill="#F87171">Off target · target 9,000</text>
      </g>
      <g transform="translate(484 96)">
        <rect width="222" height="120" rx="8" fill="#1E293B" stroke="#334155"/>
        <rect width="4" height="120" rx="2" fill="#4ADE80"/>
        <text x="16" y="26" fill="#94A3B8">Conversion rate</text>
        <text x="16" y="60" font-size="24" font-weight="700" fill="#E2E8F0">3.8%</text>
        <text x="16" y="84" fill="#4ADE80">▲ +8.6%</text>
      </g>
      <g transform="translate(718 96)">
        <rect width="218" height="120" rx="8" fill="#1E293B" stroke="#334155"/>
        <rect width="4" height="120" rx="2" fill="#4ADE80"/>
        <text x="16" y="26" fill="#94A3B8">API latency (p95)</text>
        <text x="16" y="60" font-size="24" font-weight="700" fill="#E2E8F0">245 ms</text>
        <text x="16" y="84" fill="#4ADE80">▼ -21%</text>
        <text x="16" y="104" fill="#E2E8F0">On target · target 300 ms</text>
      </g>
    </g>
    <text x="16" y="244" font-size="9" fill="#64748B">Freshness line + KPI grid only. No status panel, share link, expiry, upload form or buttons.</text>
    <text x="16" y="262" font-size="9" fill="#64748B">SharedDashboardView → Freshness + KpiGrid</text>
  </g>
</svg>
