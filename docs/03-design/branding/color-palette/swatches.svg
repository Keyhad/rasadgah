<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" width="720" height="400" font-family="'Inter', system-ui, sans-serif" role="img" aria-labelledby="title">
  <title id="title">Rasadgah colour palette</title>
  <rect width="720" height="400" fill="#0F172A"/>
  <text x="24" y="36" font-size="18" font-weight="700" fill="#E2E8F0">Rasadgah — Night Sky palette</text>

  <text x="24" y="70" font-size="11" font-weight="600" letter-spacing="2" fill="#94A3B8">BRAND</text>
  <g font-size="11">
    <rect x="24" y="80" width="150" height="64" rx="10" fill="#38BDF8"/>
    <text x="36" y="132" fill="#0F172A" font-weight="600">sky-400 #38BDF8</text>
    <rect x="190" y="80" width="150" height="64" rx="10" fill="#0369A1"/>
    <text x="202" y="132" fill="#FFFFFF" font-weight="600">sky-700 #0369A1</text>
    <rect x="356" y="80" width="150" height="64" rx="10" fill="#FBBF24"/>
    <text x="368" y="132" fill="#0F172A" font-weight="600">star-400 #FBBF24</text>
    <rect x="522" y="80" width="150" height="64" rx="10" fill="#0F172A" stroke="#334155"/>
    <text x="534" y="132" fill="#E2E8F0" font-weight="600">navy-900 #0F172A</text>
  </g>

  <text x="24" y="176" font-size="11" font-weight="600" letter-spacing="2" fill="#94A3B8">DARK SURFACES AND TEXT</text>
  <g font-size="11">
    <rect x="24" y="186" width="124" height="64" rx="10" fill="#1E293B" stroke="#334155"/>
    <text x="34" y="238" fill="#E2E8F0" font-weight="600">panel #1E293B</text>
    <rect x="160" y="186" width="124" height="64" rx="10" fill="#334155"/>
    <text x="170" y="238" fill="#E2E8F0" font-weight="600">border #334155</text>
    <rect x="296" y="186" width="124" height="64" rx="10" fill="#E2E8F0"/>
    <text x="306" y="238" fill="#0F172A" font-weight="600">text #E2E8F0</text>
    <rect x="432" y="186" width="124" height="64" rx="10" fill="#94A3B8"/>
    <text x="442" y="238" fill="#0F172A" font-weight="600">muted #94A3B8</text>
  </g>

  <text x="24" y="282" font-size="11" font-weight="600" letter-spacing="2" fill="#94A3B8">SEMANTIC (KPI ASSESSMENT)</text>
  <g font-size="11">
    <rect x="24" y="292" width="150" height="64" rx="10" fill="#4ADE80"/>
    <text x="36" y="344" fill="#0F172A" font-weight="600">positive #4ADE80</text>
    <rect x="190" y="292" width="150" height="64" rx="10" fill="#F87171"/>
    <text x="202" y="344" fill="#0F172A" font-weight="600">negative #F87171</text>
    <rect x="356" y="292" width="150" height="64" rx="10" fill="#94A3B8"/>
    <text x="368" y="344" fill="#0F172A" font-weight="600">neutral #94A3B8</text>
    <rect x="522" y="292" width="150" height="64" rx="10" fill="#FBBF24"/>
    <text x="534" y="344" fill="#0F172A" font-weight="600">target #FBBF24</text>
  </g>
  <text x="24" y="384" font-size="10" fill="#94A3B8">Source of truth: docs/03-design/branding/branding.yml</text>
</svg>
